<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>RAM Exhaustion & Screen Corruption</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      overflow: hidden;
      user-select: none;
    }

    body {
      background-color: #0a0a0f;
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      image-rendering: pixelated; /* Crisp glitch aesthetics */
    }

    .ui {
      position: absolute;
      top: 20px;
      left: 20px;
      pointer-events: none;
      z-index: 10;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 15px;
      border: 1px solid #00ff66;
      border-radius: 4px;
    }

    h1 {
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    p {
      font-size: 0.75rem;
      margin-top: 4px;
      color: #88ffaa;
    }
  </style>
</head>
<body>

  <div class="ui">
    <h1>[CRITICAL_MEMORY_EXHAUSTION]</h1>
    <p>Swipe or drag to warp display buffer</p>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    let width, height;
    const mouse = { x: -1000, y: -1000, lastX: -1000, lastY: -1000, isDragging: false };

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      drawBaseSystemScreen();
    }

    // Draws a fake system UI base that gets corrupted over time
    function drawBaseSystemScreen() {
      ctx.fillStyle = '#050510';
      ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = '#00ff66';
      ctx.font = '16px monospace';
      
      const lines = [
        "SYSTEM ERROR: Out of Memory (0x8007000E)",
        "Dumping physical RAM to disk...",
        "----------------------------------------",
        "ALLOCATION_FAILURE at 0x7FFF89A2",
        "Stack buffer overflow detected.",
        "Display driver stopped responding...",
        "GPU VRAM corrupted.",
        "----------------------------------------",
        "Swipe across screen to manually allocate heap."
      ];

      for (let i = 0; i < lines.length; i++) {
        ctx.fillText(lines[i], 30, 60 + (i * 28));
      }

      // Draw grid pattern in background
      ctx.strokeStyle = 'rgba(0, 255, 102, 0.08)';
      ctx.lineWidth = 1;
      for (let x = 0; x < width; x += 30) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }
    }

    // Corrupts a region near the cursor/touch point
    function corruptAt(x, y, vx, vy) {
      const radius = Math.floor(Math.random() * 40) + 30;

      // 1. Pixel Block Shifting (Smear/Stretch)
      const sliceWidth = Math.floor(Math.random() * 120) + 40;
      const sliceHeight = Math.floor(Math.random() * 30) + 5;
      const sx = Math.max(0, Math.min(width - sliceWidth, x - sliceWidth / 2));
      const sy = Math.max(0, Math.min(height - sliceHeight, y - sliceHeight / 2));

      // Fetch region and stretch it elsewhere (simulates RAM allocation fault)
      try {
        const imgData = ctx.getImageData(sx, sy, sliceWidth, sliceHeight);
        const stretchX = sx + (vx * (Math.random() * 4 + 2));
        const stretchY = sy + (vy * (Math.random() * 4 + 2));
        const destW = sliceWidth * (Math.random() * 1.5 + 0.8);
        const destH = sliceHeight * (Math.random() * 2 + 0.5);

        ctx.putImageData(imgData, stretchX, stretchY);
        ctx.drawImage(canvas, sx, sy, sliceWidth, sliceHeight, stretchX, stretchY, destW, destH);
      } catch (e) {}

      // 2. Glitch Noise Rectangles under cursor
      const numBlocks = Math.floor(Math.random() * 5) + 3;
      for (let i = 0; i < numBlocks; i++) {
        const bx = x + (Math.random() - 0.5) * radius * 2;
        const by = y + (Math.random() - 0.5) * radius * 2;
        const bw = Math.random() * 50 + 10;
        const bh = Math.random() * 20 + 4;

        // Randomly pick color glitch tones (Cyberpunk green, pink, cyan, white)
        const colors = ['#ff0055', '#00ffff', '#ffffff', '#00ff66', '#ffcc00', '#000000'];
        ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)];
        ctx.fillRect(bx, by, bw, bh);
      }

      // 3. Screen-wide horizontal band displacement (when swiping fast)
      const speed = Math.sqrt(vx * vx + vy * vy);
      if (speed > 8) {
        const bandY = Math.floor(Math.random() * height);
        const bandH = Math.floor(Math.random() * 40) + 10;
        const shiftX = (Math.random() - 0.5) * 150;

        try {
          const bandData = ctx.getImageData(0, bandY, width, bandH);
          ctx.putImageData(bandData, shiftX, bandY);
        } catch (e) {}
      }
    }

    function handlePointerMove(px, py) {
      if (mouse.lastX < 0) {
        mouse.lastX = px;
        mouse.lastY = py;
        return;
      }

      const vx = px - mouse.lastX;
      const vy = py - mouse.lastY;

      corruptAt(px, py, vx, vy);

      mouse.lastX = px;
      mouse.lastY = py;
    }

    // Input Handlers
    window.addEventListener('resize', resize);

    window.addEventListener('mousemove', (e) => {
      handlePointerMove(e.clientX, e.clientY);
    });

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) {
        mouse.lastX = e.touches[0].clientX;
        mouse.lastY = e.touches[0].clientY;
      }
    });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
      }
    });

    window.addEventListener('touchend', () => {
      mouse.lastX = -1000;
      mouse.lastY = -1000;
    });

    resize();
  </script>
</body>
</html>
